<!DOCTYPE html>
<html>
<head>
  <title>Fidget Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
body {
  margin: 0;
  background: #2b1d2e;
  color: #fbe9dc;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { margin: 20px 0 10px; }
.menu button {
  background: #ff9f80;
  border: none;
  border-radius: 10px;
  padding: 10px 20px;
  margin: 5px;
  font-size: 16px;
  cursor: pointer;
}
.board {
  display: none;
  background: #3a2840;
  border-radius: 24px;
  max-width: 700px;
  margin: 20px auto;
  padding: 20px;
  flex-wrap: wrap;
  justify-content: center;
}
.board.active { display: flex; }
.squishy { width: 140px; margin: 10px; cursor: pointer; }
#transition {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 10;
}
  </style>
</head>
<body>
  <h1>Fidget Board</h1>

  <div class="menu">
    <button onclick="changeBoard('board1')">Board 1</button>
    <button onclick="changeBoard('board2')">Board 2</button>
  </div>

  <div class="board active" id="board1">
    <img data-still="bubble.png" id="bubble" class="squishy" onclick="playItem('bubble', 'bubble.gif', 'bubble.png', 'bubble.wav', 600)">
    <img data-still="bubble.png" id="bubble2" class="squishy" onclick="playItem('bubble2', 'bubble.gif', 'bubble.png', 'bubble.wav', 600)">
    <img data-still="button.png" id="button" class="squishy" onclick="playItem('button', 'button.gif', 'button.png', 'button.wav', 600)">
  </div>

  <div class="board" id="board2">
    <img data-still="switch.png" id="switch" class="squishy" onclick="playItem('switch', 'switch.gif', 'switch.png', 'switch.wav', 600)">
    <img data-still="switch.png" id="switch2" class="squishy" onclick="playItem('switch2', 'switch.gif', 'switch.png', 'switch.wav', 600)">
    <img data-still="button.png" id="button2" class="squishy" onclick="playItem('button2', 'button.gif', 'button.png', 'button.wav', 600)">
  </div>

    function get(name) { return files[name]; }

    function playItem(id, gif, stillImage, soundFile, duration) {
      let image = document.getElementById(id);
      image.src = get(gif) + "#" + new Date().getTime();

      let sound = new Audio(get(soundFile));
      sound.play();

      setTimeout(function() {
        image.src = get(stillImage);
      }, duration);
    }

    function changeBoard(boardId) {
      let transition = document.getElementById("transition");
      transition.src = get("transition.gif") + "#" + new Date().getTime();
      transition.style.display = "block";

      let sound = new Audio(get("whoosh.wav"));
      sound.play();

      setTimeout(function() {
        document.getElementById("board1").classList.remove("active");
        document.getElementById("board2").classList.remove("active");
        document.getElementById(boardId).classList.add("active");
      }, 350);

      setTimeout(function() {
        transition.style.display = "none";
      }, 700);
    }

    // put the still pictures on the board when the page opens
    document.querySelectorAll(".squishy").forEach(function(img) {
      img.src = get(img.getAttribute("data-still"));
    });
